<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动到期提醒 · iDream</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1c2433;font:14px/1.6 Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #dfe5ee;background:#fff;color:#26354c;border-radius:7px;padding:9px 16px}button:hover{background:#f0f6ff}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #73b5f2;outline-offset:2px}.primary{background:#1767b3;color:#fff;border-color:#1767b3}.primary:hover{background:#12568f}header{height:68px;background:#172033;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 32px}header strong{font-size:18px}header a{color:#d6e5fa;text-decoration:none}main{max-width:1440px;margin:auto;padding:28px 32px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center}.heading h1{font-size:25px;margin:0}.muted{color:#758398}.heading p{margin:7px 0 22px}.badge{display:inline-block;border-radius:5px;font-size:12px;background:#eaf3ff;color:#1767b3;padding:3px 8px}.notice{padding:14px 18px;background:#edf5ff;border:1px solid #d6e8fc;border-radius:8px;color:#315b85;margin:0 0 22px}.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.channel{padding:18px;text-align:left;min-height:142px;position:relative;transition:160ms}.channel.active{background:#f0f6ff;border:2px solid #1767b3;padding:17px}.channel b{display:block;font-size:17px;margin-bottom:7px}.channel small{display:block;color:#758398;font-size:13px}.channel span{display:block;color:#1767b3;margin-top:12px;font-size:12px}.layout{display:grid;grid-template-columns:1fr 430px;gap:24px}.panel{background:white;border:1px solid #dfe5ee;border-radius:10px;overflow:hidden}.panel-title{padding:18px 22px;border-bottom:1px solid #e8edf3;display:flex;justify-content:space-between;align-items:center}.panel-title h2{font-size:17px;margin:0}.body{padding:22px}.steps{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px;color:#63728a}.steps b{font-weight:500;background:#f1f5fa;padding:7px 12px;border-radius:5px}.field{display:grid;gap:7px;margin-bottom:16px}.field input,.field select{padding:10px;border:1px solid #cbd5e1;border-radius:6px;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.message{padding:22px;background:#f8fafc;border:1px solid #e0e7ef;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}.message a{color:#1767b3}.message h3{font-size:16px;margin:0 0 12px}.message table{width:100%;border-collapse:collapse;font-size:13px}.message th,.message td{text-align:left;padding:10px;border-bottom:1px solid #dfe5ee}.message td:first-child{max-width:220px}.message code{font-size:12px;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.phone{width:350px;max-width:100%;margin:0 auto;border:7px solid #263246;border-radius:30px;height:600px;background:#f6f8fb;overflow:auto}.phone-top{padding:13px;text-align:center;background:#fff;border-bottom:1px solid #e3e9f0;font-weight:600;position:sticky;top:0;z-index:1}.phone-body{padding:16px}.phone h3{margin:4px 0 6px;font-size:19px}.mobile-card{background:#fff;border:1px solid #e0e7ef;padding:16px;border-radius:8px;margin:12px 0;overflow-wrap:anywhere}.mobile-card strong{display:block}.mobile-card small{display:block;color:#718097;margin-top:7px}.phone button{width:100%;margin:6px 0}.phone .field{font-size:13px}.empty{padding:30px;text-align:center;color:#758398}.status{min-height:24px;color:#1767b3;margin-top:12px}.query{padding:18px;background:#f8fafc;border-radius:8px;margin:16px 0}.scroll{overflow:auto}table.list{width:100%;border-collapse:collapse;min-width:660px}.list th,.list td{text-align:left;padding:14px;border-bottom:1px solid #e4eaf1}.list th{background:#f3f6fa;font-size:12px;color:#68788d}.list td{font-size:13px}.tag{background:#fff3df;color:#9a6616;padding:3px 7px;border-radius:4px;white-space:nowrap}.login{max-width:340px;margin:16px auto}.footnote{font-size:12px;color:#758398;margin-top:20px}dialog{border:0;border-radius:12px;padding:0;width:min(1000px,94vw);max-height:90vh;box-shadow:0 24px 80px #17203344}dialog::backdrop{background:#17203388}dialog .body{max-height:75vh;overflow:auto}@media(max-width:1050px){.layout{grid-template-columns:1fr}.channels{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:18px 14px}header{padding:0 16px}.two{grid-template-columns:1fr}.heading{align-items:flex-start}.channels{gap:8px}.channel{min-height:160px}.body{padding:16px}}
</style></head><body><header><strong>iDream <span style="color:#a0b5ce;font-size:14px;margin-left:12px">活动运营中心</span></strong><a href="gift-admin-prototype.html?menu=activityManage">返回管理后台</a></header><main><div class="heading"><div><h1>活动到期提醒 <span class="badge">四种通知方式</span></h1><p class="muted">让运营及时掌握明天到期活动，查看后统一进入活动管理。</p></div><span class="badge">交互演示</span></div><div class="notice">默认北京时间每天 14:00 提醒明天到期的活动；结束日期当日 23:59:59 截止。以下为演示数据，不发送真实短信、飞书消息或邮件。</div><nav class="channels" aria-label="通知方式"></nav><div class="layout"><section class="panel"><div class="panel-title"><h2 id="channelTitle"></h2><span class="badge" id="channelTag"></span></div><div class="body" id="channelContent"></div></section><aside class="panel"><div class="panel-title"><h2 id="previewTitle">接收与访问预览</h2><button id="resetFlow">重置流程</button></div><div class="body"><div class="phone"><div class="phone-top" id="phoneTitle"></div><div class="phone-body" id="phoneContent"></div></div><p class="footnote" id="phoneNote"></p></div></aside></div><div class="status" id="status" role="status"></div></main><dialog id="queryDialog"><div class="panel-title"><h2>活动管理 · 明天到期查询</h2><button id="closeDialog">关闭</button></div><div class="body" id="queryContent"></div></dialog><script>
(()=>{const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const channels=[{id:'sms',name:'短信通知',desc:'固定短信内容 + 短链',path:'收到短信 → 点击短链 → H5 列表'},{id:'feishu',name:'飞书通知',desc:'活动到期列表 + 后台链接',path:'收到列表 → 完成登录 → 明天到期查询'},{id:'email',name:'邮件通知',desc:'活动到期列表 + 后台链接',path:'收到列表 → 完成登录 → 明天到期查询'},{id:'page',name:'页面查询',desc:'管理后台主动查询',path:'进入活动管理 → 明天到期查询'}];let selected='sms',logged=false,phoneState='message',noData=false,linkExpired=false;const today=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));today.setDate(today.getDate()+1);const date=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;const records=[{id:'1642',name:'FrisoGo 皇家美素佳儿主题买赠活动',code:'B_BDCYMMP_P_260501'},{id:'1640',name:'路演抽奖礼兑换活动',code:'B_LYCJLDH_A_260410'},{id:'1637',name:'Y26 皇家全国主题买赠活动',code:'B_Y26M3HJ_P_260301'},{id:'1636',name:'Y26 源悦全国主题买赠活动',code:'B_Y26M3YY_N_260301'}];let list=()=>noData?[]:records;const sms='【iDream】您有活动即将到期，请及时查看并处理。详情：https://s.idream.example/a/7Kp2';const link='<a href="#" data-action="open">查看明天到期活动 →</a>';function table(){return list().length?`<table><thead><tr><th>活动名称 / 编码</th><th>结束日期</th></tr></thead><tbody>${list().map(r=>`<tr><td>${r.name}<br><code>${r.code}</code></td><td>${date}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">明天暂无到期活动</div>'}function notifyBody(){return `<h3>明天即将到期的活动</h3><div>结束日期：${date}（共 ${list().length} 项）</div>${table()}<p>${link}</p>`}function settings(){return `<div class="two"><label class="field">提醒时间（北京时间）<input value="14:00" type="time" id="sendTime"></label><label class="field">${selected==='sms'?'接收手机号':selected==='email'?'收件邮箱':'接收飞书群'}<input id="recipient" value="${selected==='sms'?'138****8000':selected==='email'?'operations@example.com':'iDream 活动运营群'}"></label></div>`}function render(){const c=channels.find(c=>c.id===selected);$('.channels').innerHTML=channels.map(c=>`<button class="channel ${c.id===selected?'active':''}" data-channel="${c.id}" aria-pressed="${c.id===selected}"><b>${c.name}</b><small>${c.desc}</small><span>${c.path}</span></button>`).join('');$('#channelTitle').textContent=c.name;$('#channelTag').textContent=selected==='page'?'主动查询':'到期前一天提醒';$('#channelContent').innerHTML=`<div class="steps">${c.path.split(' → ').map((s,i)=>`${i?'›':''}<b>${i+1}. ${s}</b>`).join('')}</div>${selected==='page'?`<div class="notice">沿用管理后台“明天到期”查询，无需发送通知。</div>${queryUI('inline')}`:`${settings()}${selected==='sms'?'<label class="field">短信内容（固定模板）</label>':selected==='email'?`<div class="muted">邮件主题</div><h3>【iDream】${date} 活动到期提醒</h3>`:''}<div class="message">${selected==='sms'?esc(sms):notifyBody()}</div><div class="actions"><button class="primary" data-action="send">模拟${selected==='sms'?'短信':selected==='email'?'邮件':'飞书'}通知</button><button data-action="open">${selected==='sms'?'打开短信短链':'点击通知中的查询链接'}</button></div><p class="footnote">${selected==='sms'?'短信不列出活动明细。短链进入 H5 只读列表，原型采用短链凭证访问；实际上线需确认链接有效期与访问范围。':'通知中直接展示到期列表；点击链接先完成后台登录，随后自动进入“明天到期”查询，按最新数据重新查询。'}</p>`}<div class="query"><strong>演示场景</strong><div class="row" style="margin-top:8px"><label><input type="checkbox" id="noData" ${noData?'checked':''}> 明天无到期活动</label>${selected==='sms'?`<label><input type="checkbox" id="expired" ${linkExpired?'checked':''}> 短链已失效</label>`:''}${['feishu','email'].includes(selected)?`<label><input type="checkbox" id="logged" ${logged?'checked':''}> 已登录后台</label>`:''}</div><small class="muted">无到期活动时不发送通知，页面查询显示空列表。</small></div>`;renderPhone();if(selected==='page')applyQuery('inline')}
function queryUI(scope){return `<div class="row"><span class="badge">明天到期</span><span>结束日期：${date}</span></div><div class="row query"><label>活动名称 / 编码 <input id="${scope}Keyword" placeholder="输入关键词" style="padding:9px;border:1px solid #cbd5e1;border-radius:5px"></label><button class="primary" data-query="${scope}">查询</button><button data-reset="${scope}">重置</button></div><p id="${scope}Count"></p><div class="scroll"><table class="list"><thead><tr><th>活动名称</th><th>活动编码</th><th>结束时间</th><th>状态</th></tr></thead><tbody id="${scope}Rows"></tbody></table></div><p class="footnote">此页仅展示演示记录。<a href="gift-admin-prototype.html?menu=activityManage&expiry=tomorrow">进入现有后台的明天到期查询</a></p>`}
function applyQuery(scope){let q=$('#'+scope+'Keyword').value.trim().toLowerCase(),rows=list().filter(r=>(r.name+' '+r.code).toLowerCase().includes(q));$('#'+scope+'Count').textContent=`共 ${rows.length} 个明天到期活动`;$('#'+scope+'Rows').innerHTML=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.code)}</td><td>${date} 23:59:59</td><td><span class="tag">明天到期</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无符合条件的活动</td></tr>'}
function renderPhone(){const content=$('#phoneContent');$('#phoneTitle').textContent=selected==='sms'?(phoneState==='message'?'短信':'iDream · 活动到期列表'):selected==='page'?'活动管理':selected==='feishu'?'飞书 · 活动运营群':'邮件 · 收件箱';$('#phoneNote').textContent=selected==='sms'?'短信短链进入 H5 列表；仅查看到期活动。':'登录状态仅在本页演示，不连接真实账号系统。';if(phoneState==='login'){content.innerHTML=`<h3>登录 iDream</h3><p class="muted">登录后继续查看明天到期活动</p><form id="loginForm"><label class="field">账号<input id="loginAccount" placeholder="请输入后台账号" required></label><label class="field">密码<input type="password" placeholder="请输入密码" required></label><button class="primary">模拟登录并继续</button></form><small class="muted">请使用任意演示信息，勿填写真实密码。</small><button data-action="cancel">返回通知</button>`;return}if(phoneState==='list'||selected==='page'){if(selected==='sms'&&linkExpired){content.innerHTML='<div class="empty"><h3>链接已失效</h3><p>请联系活动管理员获取新的查询链接。</p><button data-action="cancel">返回短信</button></div>';return}content.innerHTML=`<span class="badge">${selected==='sms'?'H5 只读列表':'明天到期'}</span><h3>明天到期的活动</h3><div class="muted">${date} · 共 ${list().length} 项</div>${list().map(r=>`<article class="mobile-card"><strong>${esc(r.name)}</strong><small>活动编码：${r.code}</small><small>结束：${date} 23:59:59</small><span class="tag">明天到期</span></article>`).join('')||'<div class="empty">明天暂无到期活动</div>'}${selected!=='sms'?'<button class="primary" data-action="query">打开后台查询</button>':''}`;return}content.innerHTML=selected==='sms'?`<small class="muted">iDream · 今天 14:00</small><div class="mobile-card">${esc(sms.split('https:')[0])}<a href="#" data-action="open">https://s.idream.example/a/7Kp2</a></div>`:`<small class="muted">${selected==='email'?'发件人：iDream 活动运营<br>主题：活动到期提醒':'iDream 活动提醒机器人 · 14:00'}</small><div class="mobile-card">${notifyBody()}</div>`}
function open(){if(selected==='sms'){phoneState='list';renderPhone()}else if(selected==='page'||logged){phoneState='list';renderPhone();openQuery()}else{phoneState='login';renderPhone()}}function openQuery(){$('#queryContent').innerHTML=queryUI('dialog');applyQuery('dialog');$('#queryDialog').showModal()}
document.addEventListener('click',e=>{const ch=e.target.closest('[data-channel]');if(ch){selected=ch.dataset.channel;phoneState='message';linkExpired=false;$('#status').textContent='';render();return}const a=e.target.closest('[data-action]');if(a){e.preventDefault();switch(a.dataset.action){case 'send':if(!$('#recipient').value.trim()||!$('#sendTime').value){$('#status').textContent='请补全接收对象及提醒时间';return}$('#status').textContent=noData?'明天无到期活动，本次不发送通知。':'已模拟生成通知，未发送真实消息。';phoneState='message';renderPhone();break;case 'open':open();break;case 'cancel':phoneState='message';renderPhone();break;case 'query':openQuery()}}if(e.target.closest('[data-query]'))applyQuery(e.target.closest('[data-query]').dataset.query);const reset=e.target.closest('[data-reset]');if(reset){$('#'+reset.dataset.reset+'Keyword').value='';applyQuery(reset.dataset.reset)}});document.addEventListener('change',e=>{if(e.target.id==='noData'){noData=e.target.checked;phoneState='message';render()}if(e.target.id==='expired'){linkExpired=e.target.checked;renderPhone()}if(e.target.id==='logged')logged=e.target.checked});document.addEventListener('submit',e=>{if(e.target.id!=='loginForm')return;e.preventDefault();logged=true;phoneState='list';renderPhone();openQuery();$('#status').textContent='模拟登录成功，已返回明天到期查询。'});$('#closeDialog').onclick=()=>$('#queryDialog').close();$('#resetFlow').onclick=()=>{logged=false;phoneState='message';linkExpired=false;$('#status').textContent='流程已重置';render()};render();})();
</script></body></html>

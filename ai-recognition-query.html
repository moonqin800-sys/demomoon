<style>
:root{--blue:#205da5;--line:#dfe4ea;--muted:#65758a}*{box-sizing:border-box}body{margin:0;background:#f0f3f6;color:#263442;font:14px Arial,'Microsoft YaHei',sans-serif}main{padding:22px;background:white;min-height:100vh}h1{font-size:21px;margin:0 0 8px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:20px 0 12px}.note{color:var(--muted);font-size:12px;line-height:1.7}.banner{padding:10px 14px;background:#eff6ff;color:#345b85;border:1px solid #d4e5fc;margin:16px 0}fieldset{border:1px solid var(--line);padding:18px;margin:16px 0}legend{font-size:19px;padding:0 10px}.filters{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px 22px}label{display:flex;flex-direction:column;gap:7px;font-size:13px}input,select,textarea{border:1px solid #cfd7df;border-radius:3px;background:white;padding:9px 10px;font:inherit;color:inherit;width:100%;min-height:38px}textarea{min-height:80px;resize:vertical}button{cursor:pointer;border:1px solid #ccd6e0;border-radius:3px;padding:9px 16px;background:white;color:#33475b;font:inherit;min-height:36px}button:hover{background:#edf4fc}button.primary{background:var(--blue);border-color:var(--blue);color:white}button:disabled{opacity:.45;cursor:not-allowed}button.link{border:0;color:var(--blue);padding:5px 8px;background:transparent}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2681eb;outline-offset:2px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.actions .right{margin-left:auto}.scroll{overflow:auto;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th{background:#f1f3f5;text-align:left;color:#596575;font-weight:500}th,td{padding:12px;border:1px solid #e2e6eb}tbody tr:hover{background:#f5f9fe}td:last-child{position:sticky;right:0;background:white}.tag{display:inline-block;padding:3px 8px;border-radius:3px;background:#eaf7f0;color:#26734d}.bad{background:#fff0eb;color:#b14c29}.pending{background:#fff7df;color:#8d691c}.pager{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin:16px 0}.pager input{width:60px}dialog{border:0;border-radius:7px;padding:0;width:min(960px,94vw);max-height:90vh;box-shadow:0 20px 70px #162c4c55}dialog::backdrop{background:#17283d66}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:2}.modal-body{padding:0 24px 22px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;background:#f7f9fc;padding:16px}.meta small{display:block;color:var(--muted);margin-bottom:6px}.error{color:#ba3f33;min-height:18px;margin:10px 0}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:16px 0}.tabs button.active{color:var(--blue);border-bottom:3px solid var(--blue)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;background:#233c58;color:white;border-radius:5px;z-index:10}#toast:empty{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.code{padding:22px;background:#f2f5f8;border:1px dashed #9aaec2;text-align:center;line-height:2}.check{flex-direction:row;align-items:center;margin:16px 0}.check input{width:18px;min-height:18px}.scroll td:last-child{min-width:300px;white-space:nowrap}.scroll td{max-width:440px;white-space:normal;min-width:110px}#detail{width:min(1200px,96vw)}#notice{width:min(440px,90vw)}.detail-table td:last-child{position:static;min-width:120px;white-space:normal}.detail-table pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:320px}.recognition-table table{table-layout:fixed;width:1900px}.recognition-table th:nth-child(1){width:110px}.recognition-table th:nth-child(2){width:280px}.recognition-table th:nth-child(3){width:360px}.recognition-table th:nth-child(4){width:440px}.recognition-table th:nth-child(5){width:140px}.recognition-table th:nth-child(6){width:150px}.recognition-table th:nth-child(7),.recognition-table th:nth-child(8){width:210px}.recognition-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recognition-table summary{overflow:hidden;text-overflow:ellipsis;cursor:pointer}.recognition-table details[open] summary{white-space:normal;overflow-wrap:anywhere}.recognition-table pre{max-width:none}.muted{color:var(--muted)}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:repeat(2,1fr)}}
</style><main><h1>AI识别查询</h1><div class="actions"><label style="margin-left:auto">演示操作身份<select id="role"><option value="400">400客服</option><option value="wedo">Wedo技术客服</option></select></label></div>
<form id="filters"><fieldset><legend>条件查询</legend><div class="filters"><label>活动名称<select name="activity"><option value="">请选择</option><option>集罐礼</option><option>妈妈粉派样</option><option>转段礼</option></select></label><label>手机号<input name="phone" placeholder="请输入手机号" maxlength="11"></label><label>会员Id<input name="member" placeholder="请输入会员Id"></label><label>业务记录Id<input name="biz" placeholder="请输入业务记录Id"></label><label>UnionId<input name="union" placeholder="请输入UnionId"></label><label>明码<input name="code" placeholder="请输入明码"></label><label>暗码<input name="secret" placeholder="请输入暗码"></label><label>最近一次AI识别状态<select name="status"><option value="">全部</option><option>审核通过</option><option>审核不通过</option><option>无法识别</option><option>识别中</option></select></label><label>客诉处理状态<select name="complaintStatus"><option value="">全部</option><option value="通过">通过</option></select></label><label>创建时间 · 开始<input type="date" name="start"></label><label>创建时间 · 结束<input type="date" name="end"></label></div><div class="actions"><button class="primary">查询</button><button type="reset">重置</button><span class="note">时间默认清空；支持手机号、会员ID及罐码查单</span></div><div class="error" id="filterError" role="alert"></div></fieldset></form>
<div class="actions"><button class="primary" id="sync">同步Ebuy罐码信息</button><span class="note" id="syncState">尚未同步</span><span class="right muted" id="count"></span></div><div class="scroll"><table><thead><tr><th>Id</th><th>活动code</th><th>活动名称</th><th>UnionId</th><th>会员Id</th><th>业务记录Id</th><th>手机号</th><th>明码</th><th>暗码</th><th>SKU</th><th>当前AI识别次数</th><th>AI识别次数上限</th><th>最近一次AI识别状态</th><th>客诉处理状态</th><th>创建时间</th><th>备注</th><th>更新时间</th><th>操作人</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="pageInfo"></span><select id="size" aria-label="每页条数" style="width:110px"><option value="10">10 条/页</option><option value="20">20 条/页</option></select><button id="prev">上一页</button><button id="next">下一页</button><input id="jump" type="number" min="1" value="1" aria-label="跳转页码"><button id="go">跳转</button></div><p class="note">演示场景：13800000001（可处理）、13800000002（同一消费者两条审核不通过记录，可验证一次处理限制）、13800000003（已处理）、13800000004（罐码不可用）、13800000005（识别中）。恢复次数额度及业务数据刷新时效待技术方案确认。</p></main>
<dialog id="notice" aria-labelledby="noticeTitle"><div class="modal-head"><h2 id="noticeTitle">提示</h2></div><div class="modal-body"><p id="noticeText"></p><button class="primary" data-close="notice">确定</button></div></dialog>
<dialog id="detail"><div class="modal-head"><h2>AI识别明细</h2><button data-close="detail" aria-label="关闭明细">关闭 ×</button></div><div class="modal-body" id="detailBody"></div></dialog>
<dialog id="action"><div class="modal-head"><h2 id="actionTitle"></h2><button data-close="action">关闭 ×</button></div><form class="modal-body" id="actionForm"></form></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=Array.from({length:24},(_,i)=>({id:1754564-i,activity:i%6<4?'集罐礼':i%2?'妈妈粉派样':'转段礼',activityCode:i%6<4?'NT_IQR1pro_P_250430':i%2?'R_MMFPY_A_250617':'CR_ZDLHJ2Z_P_250915',phone:'1380000'+String(i===7?2:i+1).padStart(4,'0'),member:String(37830187+(i===7?1:i)),biz:String(413832+i),union:'demo_oeA830xxNq_'+String(i===7?2:i+1).padStart(4,'0'),code:'TTH8XAK92XHR'+String(i+1).padStart(3,'0'),secret:'DEMO_INNER_'+String(i+1).padStart(3,'0'),status:['审核通过','审核不通过','审核通过','审核通过','识别中','无法识别'][i%6],time:'2026-11-'+String(13-Math.floor(i/4)).padStart(2,'0')+' 10:25:36',used:i===2,valid:i!==3,processed:false,restored:0,attempts:i%6===0?7:i%6,limit:7,sku:String(420403+i%5),logs:i===2?[{time:'2026-11-12 14:30:00',type:'客诉处理',note:'历史其他罐码已补录，本条为新罐码（演示）',result:'活动资格已添加；扫码 +1 罐；积分已添加（演示）',operator:'客服400-01'}]:[]}));
let operatorRole='400';let page=1,criteria={},selected,mode,tab='recognition',busy=false;function currentAccount(){try{const pill=window.parent.document.querySelector('.user-pill');if(pill){const copy=pill.cloneNode(true);copy.querySelector('.avatar')?.remove();const name=copy.textContent.trim();if(name)return name;}}catch(e){}return '活动运营';}function stamp(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function toast(t){$('#toast').textContent=t;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').textContent='',3500)}function badge(s){return '<span class="tag '+(s==='审核通过'?'':s==='识别中'?'pending':'bad')+'">'+esc(s)+'</span>'}function filtered(){return data.filter(r=>Object.entries(criteria).every(([k,v])=>!v||(k==='complaintStatus'?r.processed===true:k==='start'?r.time.slice(0,10)>=v:k==='end'?r.time.slice(0,10)<=v:['activity','status'].includes(k)?r[k]===v:r[k].includes(v))))}function render(){let all=filtered(),size=+$('#size').value,max=Math.max(1,Math.ceil(all.length/size));page=Math.min(page,max);$('#count').textContent='共 '+all.length+' 条记录';$('#rows').innerHTML=all.slice((page-1)*size,page*size).map(r=>'<tr>'+[r.id,r.activityCode,r.activity==='集罐礼'?'IQR1pro皇家2段400g集罐礼':r.activity,r.union,r.member,r.biz,r.phone,r.code,r.secret].map(v=>'<td>'+esc(v)+'</td>').join('')+'<td>'+r.sku+'</td><td>'+r.attempts+'</td><td>'+r.limit+'</td><td>'+badge(r.status)+'</td><td>'+(r.processed?'通过':'-')+'</td><td>'+r.time+'</td>'+[r.logs[0]?.note,r.logs[0]?.time,r.logs[0]?.operator].map(v=>'<td>'+esc(v||'—')+'</td>').join('')+'<td><button class="link" data-detail="'+r.id+'">明细</button>'+(r.status==='审核不通过'?'<button class="link complaint-link" data-row-action="complaint" data-id="'+r.id+'" '+(blocked(r)?'aria-description="操作受限" title="'+esc(blocked(r))+'"':'')+'>客诉处理</button><button class="link" data-row-action="restore" data-id="'+r.id+'">恢复AI识别次数</button>':'')+'</td></tr>').join('')||'<tr><td colspan="19" style="text-align:center;padding:55px">暂无匹配记录，请调整查询条件。</td></tr>';$('#pageInfo').textContent='第 '+page+' / '+max+' 页';$('#prev').disabled=page===1;$('#next').disabled=page===max;$('#jump').max=max;$('#jump').value=page}
$('#filters').onsubmit=e=>{e.preventDefault();let c=Object.fromEntries(new FormData(e.target));Object.keys(c).forEach(k=>c[k]=c[k].trim());let error=c.phone&&!/^1\d{10}$/.test(c.phone)?'请输入正确的11位手机号':c.start&&c.end&&c.start>c.end?'开始时间不能晚于结束时间':'';$('#filterError').textContent=error;if(error)return;criteria=c;page=1;render()};$('#filters').onreset=()=>{criteria={};page=1;$('#filterError').textContent='';render()};$('#size').onchange=()=>{page=1;render()};$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};$('#go').onclick=()=>{let n=Number($('#jump').value);if(!Number.isInteger(n)||n<1||n>Number($('#jump').max)){toast('请输入有效页码');return}page=n;render()};
function blocked(r){return r.activity!=='集罐礼'?'目前仅支持集罐礼':r.processed?'已有客诉处理记录不可操作':operatorRole==='400'&&(r.used||data.some(x=>(x.member===r.member||x.union===r.union||x.phone===r.phone)&&x.used))?'已有客诉处理记录不可操作':r.status!=='审核不通过'?'仅审核不通过的记录支持客诉处理':''}
$('#role').onchange=e=>{operatorRole=e.target.value;render();toast('已切换演示身份：'+(operatorRole==='400'?'400客服':'Wedo技术客服'))};
function openDetail(id){selected=data.find(r=>r.id===+id);tab='recognition';detailRender();$('#detail').showModal()}
function showNotice(message){$('#noticeText').textContent=message;$('#notice').showModal()}
function detailRender(){const r=selected;const logs=r.logs;const complaintLogs=logs.filter(l=>l.type==='客诉处理');
const history=Array.from({length:Math.max(1,Math.min(r.attempts,7))},(_,i)=>({id:r.id+'-'+(i+1),bid:'demo_bid_'+r.id+'_'+(i+1),recognition:r.status==='审核通过'?'实罐且锡纸盖揭下；':r.status==='识别中'?'识别中':i%2?'该图片翻拍；看不到罐内；':'该图片翻拍；实罐且锡纸盖揭下；',result:JSON.stringify({requestId:'demo_'+r.id+'_'+i,status:r.status==='审核通过'?1:0,message:r.status}),time:r.time,note:i===0?'最近一次识别':''}));
const logTable=(items,empty)=>'<div class="scroll detail-table"><table><thead><tr><th>操作类型</th><th>处理原因 / 备注</th><th>支持文件</th><th>处理结果</th><th>操作时间</th><th>操作人</th></tr></thead><tbody>'+items.map(l=>'<tr>'+[l.type,l.note,l.files||'—',l.result,l.time,l.operator].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+(items.length?'':'<tr><td colspan="6" style="text-align:center;padding:26px">'+empty+'</td></tr>')+'</tbody></table></div>';
$('#detailBody').innerHTML='<p class="note">会员Id：'+esc(r.member)+'　手机号：'+esc(r.phone)+'　业务记录Id：'+esc(r.biz)+'　客诉处理状态：'+(r.processed?'通过':'-')+'</p><h3>AI识别记录</h3><div class="scroll detail-table recognition-table"><table><thead><tr><th>明细Id</th><th>请求Id（bid）</th><th>识别结果</th><th>接口原始结果</th><th>图片地址</th><th>备注</th><th>创建时间</th><th>更新时间</th></tr></thead><tbody>'+history.map(h=>'<tr><td>'+h.id+'</td><td title="'+esc(h.bid)+'">'+esc(h.bid)+'</td><td>'+esc(h.recognition)+'</td><td><details><summary title="展开接口原始结果">'+esc(h.result)+'</summary><pre>'+esc(h.result)+'</pre></details></td><td><button class="link" data-image-notice>点击查看</button></td><td>'+h.note+'</td><td>'+h.time+'</td><td>—</td></tr>').join('')+'</tbody></table></div><h3>客诉操作记录</h3>'+logTable(complaintLogs,'暂无客诉操作记录')+'<h3>恢复AI次数操作记录</h3>'+logTable(logs.filter(l=>l.type!=='客诉处理'),'暂无恢复AI次数操作记录');
}
function openAction(m){if(!selected||selected.status!=='审核不通过'){toast('仅审核不通过的记录支持此操作');return}if(m==='complaint'&&blocked(selected)){showNotice(blocked(selected));return}mode=m;let r=selected;$('#actionTitle').textContent=m==='complaint'?'客诉处理 · 集罐礼':'恢复AI识别次数';$('#actionForm').innerHTML='<div class="banner">会员 '+r.member+' · '+esc(r.activity)+'<br>活动代码：'+r.activityCode+' · 参与记录编号：'+r.biz+'<br>操作身份：'+(operatorRole==='400'?'400客服（每位消费者仅一次）':'Wedo技术客服（不受400一次限制）')+'</div>'+(m==='complaint'?'<label>暗码 · 系统自动带出，不可修改<input readonly value="'+r.secret+'"></label><p class="note">明码：'+r.code+'</p>'+(operatorRole==='wedo'?'<label class="check"><input type="checkbox" name="addQualification" checked>是否增加集罐礼资格</label>':'')+'<p class="note">校验罐码 → 补录扫码（集罐礼+1罐）→ 调用Ebuy添加积分 → 上送RDSC权益中台。'+(operatorRole==='wedo'?'勾选时同时增加集罐礼资格。':'同时增加集罐礼资格。')+'</p><label>支持文件（选填）<input name="files" type="file" multiple accept=".jpg,.jpeg,.png,.pdf"></label><p class="note">支持 JPG、PNG、PDF；每个文件不超过10MB（按PPT示例）。文件仅展示名称，不上传。</p>':'<p>为该消费者在当前活动恢复 <strong>1 次</strong>AI识别机会。</p><p class="note">1次为演示额度，提交后识别次数上限增加1，已用次数保持不变；正式额度、上限及权限待确认。</p>')+'<label>处理备注 / 原因（必填）<textarea name="note" required maxlength="500" placeholder="请输入客诉原因、审核依据或恢复原因"></textarea></label><div class="error" id="actionError" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="submitAction">确认提交</button></div>';$('#cancel').onclick=()=>{if(!busy)$('#action').close()};$('#action').showModal()}
$('#actionForm').onsubmit=async e=>{e.preventDefault();if(busy)return;let r=selected,operationAccount=currentAccount(),note=e.target.elements.note.value.trim(),files=mode==='complaint'?[...e.target.elements.files.files]:[];let err=!note?'请填写处理备注':files.some(f=>f.size>10*1024*1024||!(/\.(png|jpe?g|pdf)$/i.test(f.name)))?'请上传10MB以内的JPG、PNG或PDF文件':mode==='complaint'?blocked(r):'';$('#actionError').textContent=err;if(err)return;busy=true;$('#submitAction').disabled=true;$('#submitAction').textContent='校验并处理中…';await new Promise(r=>setTimeout(r,650));if(mode==='complaint'&&!r.valid){$('#actionError').textContent='罐码校验失败：该罐码已被使用，未添加资格、扫码记录或积分，请核实后处理。';$('#submitAction').disabled=false;$('#submitAction').textContent='重新提交';busy=false;return}const addQualification=mode==='complaint'&&(operatorRole==='400'||Boolean(e.target.elements.addQualification?.checked));if(mode==='complaint'){r.processed=true;if(operatorRole==='400')r.used=true;}else{r.restored++;r.limit++;}r.logs.unshift({time:stamp(),type:mode==='complaint'?'客诉处理':'AI恢复次数',note,files:files.map(f=>f.name).join('、'),result:mode==='complaint'?'罐码校验通过；'+(addQualification?'集罐礼资格已增加；':'未增加集罐礼资格；')+'扫码记录已补录（+1罐）；Ebuy积分添加成功；RDSC权益中台上送成功（均为演示）':'恢复1次，AI识别上限增加1（演示）',operator:operationAccount});busy=false;$('#action').close();if($('#detail').open)$('#detail').close();render();toast('演示处理成功，已记录操作；真实数据刷新时效待确认')};
$('#sync').onclick=async()=>{$('#sync').disabled=true;$('#syncState').textContent='正在同步演示罐码信息…';await new Promise(r=>setTimeout(r,700));$('#syncState').textContent='演示同步完成 · '+stamp()+' · 真实Ebuy接口未接入';$('#sync').disabled=false};document.addEventListener('click',e=>{if(e.target.closest('[data-image-notice]'))showNotice('该演示记录未提供原始图片，正式环境将展示对应上传图片。');let b=e.target.closest('[data-detail]');if(b)openDetail(b.dataset.detail);let a=e.target.closest('[data-row-action]');if(a&&!a.disabled){selected=data.find(r=>r.id===Number(a.dataset.id));openAction(a.dataset.rowAction)}let c=e.target.closest('[data-close]');if(c&&!busy)$('#'+c.dataset.close).close()});$('#action').addEventListener('cancel',e=>{if(busy)e.preventDefault()});render();
</script></html>

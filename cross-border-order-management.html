<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>跨境订单录入管理</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f7fb;color:#24344c;font:14px/1.6 -apple-system,'PingFang SC',sans-serif}h1{margin:0;font-size:24px}p,small{color:#718097}.panel{padding:20px;background:white;border:1px solid #e3e9f1;border-radius:12px;margin:16px 0}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:grid;gap:6px;font-size:13px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #d7e0ec;border-radius:6px;background:white}button{cursor:pointer;color:#1767b3;min-height:40px}.primary{background:#1767b3;color:white;border:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f4}th{background:#f6f8fb;color:#68788e;font-weight:500}.tag{background:#eaf5ee;color:#287949;padding:4px 8px;border-radius:5px}.err{color:#b53b36}dialog{width:min(950px,95vw);border:0;border-radius:14px;padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#1a2d4266}.detail{display:grid;grid-template-columns:280px 1fr;gap:20px}.receipt{background:#fafafa;padding:20px;border:1px solid #ddd;line-height:2.2}.close{float:right}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subtle{color:#718097;font-size:12px}@media(max-width:850px){.filters{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}.brand-totals{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.brand-total{background:#eff5fc;border:1px solid #dbe7f5;border-radius:8px;padding:12px 16px}.changed td{background:#fff5e7}.compare-wrap{max-height:300px;overflow:auto}.facts{padding:14px;background:#f7f9fc;border-radius:8px}.order-preview{display:block;width:100%;height:315px;object-fit:contain;background:#eef1f5;border:1px solid #dce4ef}.order-thumbs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}.order-thumb{flex:0 0 82px;padding:4px;font-size:12px}.order-thumb img{display:block;width:100%;height:68px;object-fit:contain}.order-thumb[aria-pressed="true"]{border-color:#1767ff;box-shadow:0 0 0 1px #1767ff}.image-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.zoom-image{display:block;max-width:100%;height:auto;margin:16px auto}#imageZoom{width:min(800px,95vw)}.compare-panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.compare-panel{min-width:0;border:1px solid #dfe6ef;border-radius:8px;overflow:hidden}.compare-panel h4{margin:0;padding:12px;background:#f0f5fb;font-size:15px}.compare-content{padding:12px}.compare-field{margin:7px 0;padding:5px;overflow-wrap:anywhere}.compare-field span{display:block;color:#718097;font-size:12px}.compare-field.diff{background:#fff0db;border-radius:4px}.compare-item{border-top:1px solid #e4eaf2;margin-top:12px;padding-top:10px}.compare-item b{font-size:13px}@media(max-width:600px){.compare-panels{grid-template-columns:1fr}}</style>
<h1>跨境订单录入管理</h1><p>按 KA、门店及上传人员查询订单，核对订单与商品信息。</p><form class="panel" id="filters"><div class="filters"><label>订单号<input name="no" placeholder="输入订单号"></label><label>KA<select name="ka"><option value="">全部</option><option>山姆</option><option>爱婴室</option><option>孩子王</option><option>沃尔玛</option><option>爱婴岛</option><option>盒马</option><option>天虹</option></select></label><label>门店<input name="store" placeholder="名称 / 编码"></label><label>上传人<input name="operator" placeholder="姓名 / 账号"></label><label>品牌<select name="brand"><option value="">全部</option><option>港版皇家</option><option>港版有机皇家</option><option>荷兰版美素佳儿</option></select></label><label>上传开始日期<input type="date" name="start"></label><label>上传结束日期<input type="date" name="end"></label><label>是否人工修改<select name="modified"><option value="">全部</option><option>是</option><option>否</option></select></label></div><div style="margin-top:18px;display:flex;gap:10px"><button class="primary">查询</button><button type="reset">重置</button><span id="error" class="err" role="alert"></span></div></form><section class="panel"><div class="toolbar"><b id="count"></b><button id="export">导出筛选结果</button></div><div class="scroll"><table><thead><tr><th>订单号 / 下单日期</th><th>KA / 门店</th><th>订单详情</th><th>上传人</th><th>上传时间</th><th>是否人工修改</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><small>按上传时间倒序 · 每页5条</small><div><button id="prev">上一页</button> <span id="pages"></span> <button id="next">下一页</button></div></div><small>演示数据。后台查询、导出与原始识别对照为本次建议范围。</small></section><dialog id="detail"><button class="close" id="close">关闭</button><h2>订单详情</h2><div id="detailBody"></div></dialog>
<dialog id="imageZoom"><button id="closeImageZoom" class="close">关闭</button><h2>订单截图</h2><img id="zoomImage" class="zoom-image" alt="订单截图放大图"></dialog><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=1;const data=Array.from({length:12},(_,i)=>({id:i,no:i<2?'202611020001':`20261102${String(i+1).padStart(4,'0')}`,date:'2026-11-02',ka:['山姆','爱婴室','孩子王','沃尔玛'][i%4],store:['上海浦东店','杭州滨江店','南京新街口店'][i%3],code:'S'+(1000+i),operator:'FMC '+(i%3+1),account:'fmc00'+(i%3+1),at:`2026-11-03 ${String(18-i).padStart(2,'0')}:20:00`,modified:i%2?'否':'是',items:[{brand:'港版皇家',stage:'2段',gram:800,qty:3},...(i%2?[]:[{brand:'港版有机皇家',stage:'3段',gram:800,qty:2}])]}));data.forEach((r,i)=>{if(i%3===2)r.items.push({brand:'荷兰版美素佳儿',stage:'4段',gram:400,qty:4});r.original={no:r.no,date:r.date,items:r.items.map((x,j)=>({...x,lineId:'L'+(j+1)}))};r.items=r.items.map((x,j)=>({...x,lineId:'L'+(j+1)}));if(r.modified==='是'){r.original.items[0].qty=2;if(i%4===0)r.original.items[0].gram=400;}if(i===11){r.date='2026-09-25';r.at='2026-10-01 10:20:00';r.original.date=r.date;}});let results=[...data];
function brandTotals(r){const totals={};r.items.forEach(x=>totals[x.brand]=(totals[x.brand]||0)+x.qty);return Object.entries(totals).map(([brand,qty])=>`<div class="brand-total"><b>${esc(brand)}</b><br>${qty} 听</div>`).join('')}
function comparisonPanel(r,original){const value=original?r.original:r;const field=(label,key,obj,old)=>'<div class="compare-field '+(!original&&obj[key]!==old[key]?'diff':'')+'"><span>'+label+'</span>'+esc(obj[key])+'</div>';return '<section class="compare-panel"><h4>'+(original?'AI识别值':'提交值')+'</h4><div class="compare-content">'+field('订单号','no',value,r.original)+field('下单日期','date',value,r.original)+value.items.map((x,i)=>{const old=r.original.items.find(y=>y.lineId===x.lineId)||{};return '<div class="compare-item"><b>商品 '+(i+1)+'</b>'+[['品牌','brand'],['阶段','stage'],['克数（G）','gram'],['听数','qty']].map(([label,key])=>field(label,key,x,old)).join('')+'</div>'}).join('')+'</div></section>'}
function comparisons(r){const rows=[['订单号',r.original.no,r.no],['下单日期',r.original.date,r.date]];r.items.forEach((x,i)=>{const old=r.original.items.find(a=>a.lineId===x.lineId)||{};[['brand','品牌'],['stage','阶段'],['gram','克数（G）'],['qty','听数']].forEach(([key,label])=>rows.push(['商品'+(i+1)+' · '+label,old[key]??'—',x[key]]))});return rows.map(([label,old,value])=>`<tr class="${old!==value?'changed':''}"><td>${esc(label)}</td><td>${esc(old)}</td><td>${esc(value)}</td><td>${old!==value?'是':'否'}</td></tr>`).join('')}
function submissionCheck(r){const delta=Math.round((Date.parse(r.at.slice(0,10)+'T00:00:00+08:00')-Date.parse(r.date+'T00:00:00+08:00'))/86400000);return delta>=0&&delta<=29?'通过（提交时距下单 '+delta+' 天）':'未通过'}
function summary(r){return r.items.map(x=>`${x.brand} ${x.stage} ${x.qty}听`).join('、')}function query(){const f=Object.fromEntries(new FormData($('filters')));if(f.start&&f.end&&f.start>f.end){$('error').textContent='开始日期不能晚于结束日期';return false}$('error').textContent='';results=data.filter(r=>(!f.no||r.no.includes(f.no.trim()))&&(!f.ka||r.ka===f.ka)&&(!f.store||(r.store+r.code).includes(f.store.trim()))&&(!f.operator||(r.operator+r.account).includes(f.operator.trim()))&&(!f.brand||r.items.some(x=>x.brand===f.brand))&&(!f.modified||r.modified===f.modified)&&(!f.start||r.at.slice(0,10)>=f.start)&&(!f.end||r.at.slice(0,10)<=f.end));page=1;render();return true}function render(){const pages=Math.max(1,Math.ceil(results.length/5));$('count').textContent='共 '+results.length+' 笔订单';$('rows').innerHTML=results.slice((page-1)*5,page*5).map(r=>`<tr><td><b>${r.no}</b><br><small>${r.date}</small></td><td>${r.ka}<br><small>${r.store} / ${r.code}</small></td><td>${summary(r)}</td><td>${r.operator}<br><small>${r.account}</small></td><td>${r.at}</td><td><span class="tag">${r.modified}</span></td><td><button onclick="openDetail(${r.id})">查看详情</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:40px">暂无匹配订单</td></tr>';$('pages').textContent=page+' / '+pages;$('prev').disabled=page<=1;$('next').disabled=page>=pages}function openDetail(id){const r=data.find(x=>x.id===id);$('detailBody').innerHTML=`<div class="facts"><div>订单号：<b>${r.no}</b></div><div>KA：${r.ka}</div><div>下单日期：${r.date}</div><div>门店：${r.store} / ${r.code}</div><div>上传人：${r.operator} / ${r.account}</div><div>上传时间：${r.at}</div><div>是否人工修改：${r.modified}</div><div>提交时日期校验：${submissionCheck(r)}</div></div><h3>本订单商品明细</h3><div class="scroll"><table><thead><tr><th>品牌</th><th>阶段</th><th>克数</th><th>识别值听数</th><th>提交听数</th></tr></thead><tbody>${r.items.map(x=>{const original=r.original.items.find(y=>y.lineId===x.lineId);return `<tr><td>${esc(x.brand)}</td><td>${esc(x.stage)}</td><td>${x.gram}G</td><td>${original?original.qty:'—'}</td><td>${x.qty}</td></tr>`}).join('')}</tbody></table></div><h3>订单截图与识别对照</h3><div class="detail"><section><h3 style="margin-top:0">上传凭证</h3><p class="subtle" id="orderImageNote"></p><img class="order-preview" id="orderPreview" alt="订单截图预览"><div class="order-thumbs" id="orderThumbs"></div><div class="image-actions"><span class="subtle" id="orderImageCount"></span><button type="button" id="orderZoom">查看放大图</button></div></section><div><h3>识别结果对照</h3><div class="compare-panels">${comparisonPanel(r,true)}${comparisonPanel(r,false)}</div><p class="subtle">浅橙色标记与AI识别值不同的提交字段。</p></div></div>`;initOrderImages(r);$('detail').showModal()}function orderImage(r,index=0){const lines=['订单号：'+r.original.no,'下单日期：'+r.original.date,'KA：'+r.ka,...r.original.items.flatMap(x=>[x.brand+' '+x.stage,x.gram+'G × '+x.qty+'听']),'原型示例图片 · 第'+(index+1)+'张'];const svg='<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720"><rect width="520" height="720" fill="#eeeae0"/><rect x="26" y="20" width="468" height="680" fill="#fffdf5"/><text x="260" y="65" text-anchor="middle" font-size="23" font-family="sans-serif">订单凭证 · '+(index+1)+'/3</text><path d="M50 90H470" stroke="#ccc" stroke-dasharray="5 4"/>'+lines.map((t,i)=>'<text x="50" y="'+(130+i*48)+'" font-size="17" fill="#444" font-family="sans-serif">'+esc(t)+'</text>').join('')+'</svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
let currentImages=[],currentImage=0;
function selectOrderImage(i){currentImage=i;$('orderPreview').src=currentImages[i];$('orderImageCount').textContent='第 '+(i+1)+' / '+currentImages.length+' 张';document.querySelectorAll('.order-thumb').forEach((el,n)=>el.setAttribute('aria-pressed',String(n===i)))}
function initOrderImages(r){currentImages=r.images?.length?r.images:[0,1,2].map(i=>orderImage(r,i));$('orderImageNote').textContent=currentImages.length+' 张图片 · 订单截图';$('orderThumbs').innerHTML=currentImages.map((src,i)=>'<button type="button" class="order-thumb" aria-label="查看第'+(i+1)+'张截图" onclick="selectOrderImage('+i+')"><img src="'+esc(src)+'" alt="截图缩略图">第 '+(i+1)+' 张</button>').join('');selectOrderImage(0)}
$('orderZoom')?.addEventListener('click',()=>{});
$('detailBody').addEventListener('click',e=>{if(e.target.id==='orderZoom'){$('zoomImage').src=currentImages[currentImage];$('imageZoom').showModal()}});
$('closeImageZoom').onclick=()=>$('imageZoom').close();
$('filters').onsubmit=e=>{e.preventDefault();query()};$('filters').onreset=()=>setTimeout(query,0);$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('close').onclick=()=>$('detail').close();$('export').onclick=()=>{if(!query())return;if(!results.length){$('error').textContent='暂无可导出的订单，请调整筛选条件';return}const lines=[['KA','订单号','下单日期','门店','门店编码','上传人','上传账号','上传时间','品牌','阶段','克数G','听数','是否人工修改'],...results.flatMap(r=>r.items.map(x=>[r.ka,r.no,r.date,r.store,r.code,r.operator,r.account,r.at,x.brand,x.stage,x.gram,x.qty,r.modified]))];const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='跨境订单录入管理.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
